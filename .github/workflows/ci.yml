name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run on the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy values only. Real secrets live in your host, never here.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      SESSION_SECRET: ci-placeholder-secret-at-least-32-characters
      ALLOWED_EMAIL_DOMAINS: university.edu
      SMTP_HOST: localhost
      SMTP_USER: ci
      SMTP_PASS: ci
      SMTP_FROM: "UniVault <ci@example.com>"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Debug model config hash
        run: |
          sha256sum models/Xenova/all-MiniLM-L6-v2/config.json
          grep 'Xenova/all-MiniLM-L6-v2/config.json' models/MODEL_MANIFEST.txt

      - name: Debug model config contents
        run: |
          echo "=== Git commit ==="
          git rev-parse HEAD

          echo "=== File contents in CI ==="
          cat models/Xenova/all-MiniLM-L6-v2/config.json

          echo "=== Git-tracked file contents ==="
          git show HEAD:models/Xenova/all-MiniLM-L6-v2/config.json

          echo "=== File attributes ==="
          git check-attr -a -- models/Xenova/all-MiniLM-L6-v2/config.json

          echo "=== Hashes ==="
          sha256sum models/Xenova/all-MiniLM-L6-v2/config.json
          git show HEAD:models/Xenova/all-MiniLM-L6-v2/config.json | sha256sum



      - name: Unit tests
        run: npx vitest run --passWithNoTests

      - name: Build
        run: npm run build